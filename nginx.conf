server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # El HTML, el service worker y el manifest siempre se revisan, para que llegue el diseño nuevo.
    location ~* ^/(index\.html|sw\.js)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Fuentes, íconos y textura casi no cambian (los íconos llevan ?v= en el HTML).
    location ~* \.(woff2|png|svg|ico|jpg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
